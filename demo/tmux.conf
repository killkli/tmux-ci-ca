set -g default-terminal "xterm-256color"
setw -g mode-keys vi
set -g status on
set -g status-interval 0
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] tmux-ci-ca #[default] "
set -g status-left-length 30
set -g status-right "#[bg=#a6e3a1,fg=#11111b,bold] vi copy-mode #[default]"
set -g status-right-length 30
set -g mode-style "bg=#f9e2af,fg=#11111b,bold"

run-shell "./tmux-ci-ca.tmux"
